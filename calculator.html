<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">


<link rel="stylesheet" href="calculator.css">
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="lr"></div>
  <div class="ll">Initialising</div>
</div>

<!-- BG CANVAS -->
<canvas id="bgc"></canvas>

<!-- EASTER EGG -->
<div id="egg"><div class="eggi" onclick="closeEgg()">🚀</div></div>

<!-- ============================================================
     TOP BAR
     ============================================================ -->
<header id="topbar">
  <div class="brand">
    <div class="bmark">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="11" y2="9"/><line x1="13" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="11" y2="13"/><line x1="13" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="11" y2="17"/><line x1="13" y1="17" x2="16" y2="17"/></svg>
    </div>
    Calculator
  </div>
  <div class="tbr">CodeAlpha Project<span>v2.1</span></div>
</header>

<!-- ============================================================
     APP
     ============================================================ -->
<div id="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div id="ctrl-strip">

      <!-- Row 1: Sound -->
      <div class="srow" data-tip="Sound Effects">
        <button class="sico" onclick="toggleSound()">
          <!-- Speaker SVG -->
          <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <button class="stog on" id="stog-snd" onclick="toggleSound()"></button>
      </div>

      <!-- Row 2: Theme -->
      <div class="srow" data-tip="Dark / Light Mode">
        <button class="sico" onclick="toggleTheme()">
          <svg viewBox="0 0 24 24" id="theme-svg"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="stog" id="stog-thm" onclick="toggleTheme()"></button>
      </div>

      <!-- Row 3: History -->
      <div class="srow" data-tip="Calculation History">
        <button class="sico" onclick="toggleHistory()">
          <!-- Clock icon -->
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
        <button class="stog" id="stog-hist" onclick="toggleHistory()"></button>
      </div>

    </div><!-- /#ctrl-strip -->

    <!-- Voice button -->
    <button id="vbtn" onclick="toggleVoice()">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <div class="vlab">Voice</div>

  </div><!-- /.sidebar -->

  <!-- CALCULATOR CARD -->
  <div id="calc">

    <!-- DISPLAY (left column, spans rows 1-3) -->
    <div id="dp">
      <span class="dp-lbl">Calculator</span>
      <span class="dp-mem" id="mem-ind">M</span>
      <div class="dp-expr" id="expr-d"></div>
      <div class="dp-main" id="main-d">0</div>
      <button class="dp-copy hide" id="cpybtn" onclick="copyResult()">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span id="cpylbl">Copy Result</span>
      </button>
    </div>

    <!-- MODE TABS -->
    <div id="mtabs">
      <button class="mtab on" id="tab-s" onclick="setMode('std')">Standard</button>
      <button class="mtab"    id="tab-c" onclick="setMode('sci')">Scientific</button>
    </div>

    <!-- SCIENTIFIC PANEL -->
    <div id="scip">
      <button class="sbtn" onclick="sci('sin')">sin</button>
      <button class="sbtn" onclick="sci('cos')">cos</button>
      <button class="sbtn" onclick="sci('tan')">tan</button>
      <button class="sbtn" onclick="sci('log')">log</button>
      <button class="sbtn" onclick="sci('ln')">ln</button>
      <button class="sbtn" onclick="sci('sqrt')">√x</button>
      <button class="sbtn" onclick="sci('sq')">x²</button>
      <button class="sbtn" onclick="sci('pi')">π</button>
      <button class="sbtn" onclick="sci('e')">e</button>
      <button class="sbtn" onclick="sci('pow')">xʸ</button>
      <button class="sbtn" onclick="sci('inv')">1/x</button>
      <button class="sbtn" onclick="sci('abs')">|x|</button>
    </div>

    <!-- BUTTON AREA -->
    <div id="barea">

      <!-- Memory row -->
      <div class="mrow">
        <button class="btn mb" onclick="mem('MC')">MC</button>
        <button class="btn mb" onclick="mem('MR')">MR</button>
        <button class="btn mb" onclick="mem('M+')">M+</button>
        <button class="btn mb" onclick="mem('M-')">M−</button>
      </div>

      <!-- Main grid -->
      <div class="mgrid">
        <button class="btn sp" id="acbtn" onclick="press('AC')">AC</button>
        <button class="btn sp" onclick="press('sign')">+/−</button>
        <button class="btn sp" onclick="press('%')">%</button>
        <button class="btn op" onclick="press('/')">÷</button>

        <button class="btn" onclick="press('7')">7</button>
        <button class="btn" onclick="press('8')">8</button>
        <button class="btn" onclick="press('9')">9</button>
        <button class="btn op" onclick="press('*')">×</button>

        <button class="btn" onclick="press('4')">4</button>
        <button class="btn" onclick="press('5')">5</button>
        <button class="btn" onclick="press('6')">6</button>
        <button class="btn op" onclick="press('-')">−</button>

        <button class="btn" onclick="press('1')">1</button>
        <button class="btn" onclick="press('2')">2</button>
        <button class="btn" onclick="press('3')">3</button>
        <button class="btn op" onclick="press('+')">+</button>

        <button class="btn s2" onclick="press('0')">0</button>
        <button class="btn" onclick="press('.')">.</button>
        <button class="btn eq" onclick="press('=')">=</button>
      </div>

    </div>

  </div><!-- /#calc -->

</div><!-- /#app -->

<!-- HISTORY PANEL -->
<div id="hpanel">
  <div class="hh">
    <span class="htitle">History</span>
    <button class="hclr" onclick="clearHist()">Clear All</button>
  </div>
  <div id="hlist"><div class="hempty">No calculations yet</div></div>
</div>

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
<script src="calculator.js"></script>
</body>
</html>
